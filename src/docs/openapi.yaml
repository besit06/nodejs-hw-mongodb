openapi: 3.1.0
info:
  version: 1.0.0
  title: Swagger-Contacts-App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Swagger-Contacts-App
tags: []

servers:
  - url: http://127.0.0.1:3000
  - url: https://nodejs-hw7-swagger-qa1r.onrender.com/api-docs

paths:
  /contacts:
    get:
      $ref: "../swagger/path/contacts/get.yaml"
    post:
      $ref: "../swagger/path/contacts/post.yaml"

  /contacts/{Id}:
    get:
      $ref: "../swagger/path/contacts/{Id}/get.yaml"
    patch:
      $ref: "../swagger/path/contacts/{Id}/patch.yaml"
    delete:
      $ref: "../swagger/path/contacts/{Id}/delete.yaml"

  /users/signup:
    post:
      $ref: "../swagger/path/users/signup.yaml"

  /users/login:
    post:
      $ref: "../swagger/path/users/login.yaml"

  /users/logout:
    post:
      $ref: "../swagger/path/users/logout.yaml"

components:
  schemas:
    Contact:
      $ref: "../swagger/components/schemas/Contact.yaml"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    "404":
      $ref: "../swagger/components/responses/NotFound.yaml"
    UserSignup:
      $ref: "../swagger/components/schemas/UserSignup.yaml"
    UserLogin:
      $ref: "../swagger/components/schemas/UserLogin.yaml"
    AuthResponse:
      $ref: "../swagger/components/schemas/AuthResponse.yaml"
