openapi: 3.1.0
info:
  version: 1.0.0
  title: Swagger-Contacts-App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: Swagger-Contacts-App
tags: []

servers:
  - url: http://127.0.0.1:3000
  - url: http://127.0.0.1:8080

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'

components:
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
