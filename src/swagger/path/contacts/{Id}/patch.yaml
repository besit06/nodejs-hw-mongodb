tags:
  - Contacts
summary: UpdateContact
operationId: updateContact
description: Updates contact
security:
  - bearerAuth: []
parameters:
  - name: Id
    in: path
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            format: email
            example: johndoe@example.com
          phone:
            type: string
            example: "+1234567890"
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: ["work", "home", "personal"]
            example: "work"
responses:
  "200":
    description: Contact updated!
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Contact.yaml
  "400":
    description: Bad request
  "401":
    description: Unauthorized
  "404":
    description: Contact not Found
    content:
      application/json:
        schema:
          $ref: ../../../components/responses/NotFound.yaml
