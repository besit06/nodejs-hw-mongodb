get:
  tags:
    - Contacts
  summary: GetAllContacts
  operationId: GetAllContacts
  description: GetAllContacts
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      description: Page
      required: false
      schema:
        type: integer
        example: 1
    - name: limit
      in: query
      description: Contacts per page
      required: false
      schema:
        type: integer
        example: 5
  responses:
    '200':
      description: ContactsList
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/Contact.yaml'
    '401':
      description: Unauthorized
    '500':
      description: Server error
