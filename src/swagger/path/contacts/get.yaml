tags:
  - Contacts
summary: GetAllContacts
operationId: GetAllContacts
description: GetAllContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number
    required: false
    schema:
      type: integer
      example: 1
  - name: limit
    in: query
    description: Number of contacts per page
    required: false
    schema:
      type: integer
      example: 5
  - name: sortBy
    in: query
    description: Field by which to sort contacts
    required: false
    schema:
      type: string
      enum: [name, email, phone]
      example: name
  - name: sortOrder
    in: query
    description: Sorting order
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - name: isFavourite
    in: query
    description: Filter by favorite status
    required: false
    schema:
      type: boolean
      example: true
responses:
  "200":
    description: Contacts list
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/Contact.yaml
  "401":
    description: Unauthorized
  "500":
    description: Server error
