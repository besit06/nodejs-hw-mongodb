tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Adds a new contact to the database.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            example: John Doe
          email:
            type: string
            format: email
            example: johndoe@example.com
          phone:
            type: string
            example: "+1234567890"
          isFavourite:
            type: boolean
            example: false
          contactType:
            type: string
            enum: ["work", "home", "personal"]
            example: "personal"
        required:
          - name
          - email
          - phone
responses:
  "201":
    description: Contact created successfully
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  "400":
    description: Bad request
  "401":
    description: Unauthorized
