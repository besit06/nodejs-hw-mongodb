type: object
properties:
  id:
    type: string
    example: "60d0fe4f5311236168a109ca"
  name:
    type: string
    example: "John Doe"
  email:
    type: string
    format: email
    example: "johndoe@example.com"
  phone:
    type: string
    example: "+1234567890"
required:
  - name
  - email
  - phone
