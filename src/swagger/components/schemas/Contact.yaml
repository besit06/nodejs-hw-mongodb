type: object
properties:
  id:
    type: string
    example: 60d0fe4f5311236168a109ca
  name:
    type: string
    example: John Doe
  email:
    type: string
    format: email
    example: johndoe@example.com
  phone:
    type: string
    example: "+1234567890"
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
required:
  - name
  - email
  - phone
  - contactType
